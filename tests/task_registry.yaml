schema_version: "1.0.0"
product: AI DSPM
cli:
  check_flag: CHECK
  phase_flag: PHASE
exit_codes:
  pass: 0
  fail: 1
  unimplemented_or_empty: 2
  missing_evidence_or_credential: 3
notes:
  - Zero collected tests must never be treated as a pass.
  - Required skips fail the check.
  - Browser flows are not_applicable until first-live-stack.
  - spec_id is a cross-walk to docs/AI_DSPM_Implementation_Plan_and_Tasks.md only.

checks:
  product-contract:
    spec_id: T01
    phase: foundations
    status: runnable
    prerequisites: []
    frontend: not_applicable
    profiles: []
    pytest_selectors: []
    required_files:
      - docs/scope.json
      - docs/capabilities/mvp.md
      - docs/adr/0001-boundaries.md
    command: python scripts/verify.py --internal product-contract

  toolchain:
    spec_id: T02
    phase: foundations
    status: runnable
    prerequisites: [product-contract]
    frontend: not_applicable
    profiles: []
    pytest_selectors: []
    required_files:
      - pyproject.toml
      - uv.lock
      - apps/web/package.json
      - pnpm-lock.yaml
      - ops/images.lock.json
      - Makefile
    command: make doctor && make build

  verify-harness:
    spec_id: T03
    phase: foundations
    status: runnable
    prerequisites: [toolchain]
    frontend: not_applicable
    profiles: []
    pytest_selectors:
      - tests/harness
    required_files:
      - scripts/verify.py
      - scripts/evidence.py
      - tests/task_registry.yaml
      - tests/conftest.py

  first-live-stack:
    spec_id: T04
    phase: foundations
    status: unimplemented
    prerequisites: [verify-harness]
    frontend: required_later
