[project]
name = "ai-dspm-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "ai-dspm-domain",
  "fastapi[standard]==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.5",
  "httpx==0.28.1",
  "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dspm_api"]

[tool.uv.sources]
ai-dspm-domain = { workspace = true }