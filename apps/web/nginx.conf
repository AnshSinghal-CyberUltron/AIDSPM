server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /livez {
        proxy_pass http://api:8000/livez;
    }
    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }
    location /api/ {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
